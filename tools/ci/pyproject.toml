[project]
name = "ci-tool"
version = "1.0.0"
description = "CI orchestration tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "jinja2>=3.0",
    "httpx==0.26.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx==0.20.2",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ci = "ci_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_tool"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
