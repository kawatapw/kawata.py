name: Security Scan 
# Checks for branches to run on are not working?
# Trivy cannot load docker image for kawata.py?


on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "The version from project"
        required: true
        type: string
      tag_list:
        description: "Space-separated list of tags"
        required: true
        type: string
      github_owner:
        description: "The GitHub owner"
        required: true
        type: string
      github_repo:
        description: "The GitHub repo"
        required: true
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Workflow
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow sec-scan

      - name: Upload CI State
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-sec-scan
          path: ci-data/
          retention-days: 30

