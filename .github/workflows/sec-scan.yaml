name: Security Scan 
# Checks for branches to run on are not working?
# Trivy cannot load docker image for kawata.py?


on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "The version from project"
        required: true
        type: string
      tag_list:
        description: "Space-separated list of tags"
        required: true
        type: string
      github_owner:
        description: "The GitHub owner"
        required: true
        type: string
      github_repo:
        description: "The GitHub repo"
        required: true
        type: string

jobs:
  safety:
    if: |
      ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }} ||
      contains(github.ref, 'refs/heads/master') ||
      contains(github.ref, 'refs/heads/latest') ||
      contains(github.ref, 'refs/heads/BE-Master') ||
      contains(github.ref, 'refs/heads/BE-Prod') ||
      contains(github.ref, 'refs/heads/BE-Staging') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Job
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow sec-scan --job safety

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run safety (requirements)
        run: |
          uv run safety check --json --output safety-report.json || true

      - name: Upload safety report
        uses: actions/upload-artifact@v7
        with:
          name: safety-report
          path: safety-report.json

      - name: Parse Results
        run: |
          uv run --only-group ci python tools/ci/ci.py artifacts collect

      - name: Generate Summary
        run: |
          uv run --only-group ci python tools/ci/ci.py summary generate --workflow sec-scan

      - name: Upload CI State
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-sec-scan-safety
          path: ci-data/
          retention-days: 30

      - name: Finish Job
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow sec-scan --job safety --status ${{ job.status }}

  bandit:
    if: |
      ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }} ||
      contains(github.ref, 'refs/heads/master') ||
      contains(github.ref, 'refs/heads/latest') ||
      contains(github.ref, 'refs/heads/BE-Master') ||
      contains(github.ref, 'refs/heads/BE-Prod') ||
      contains(github.ref, 'refs/heads/BE-Staging') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Job
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow sec-scan --job bandit

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run bandit (security lint)
        id: bandit
        run: |
          mkdir -p reports
          # Run bandit and capture output (configuration from pyproject.toml)
          uv run bandit -c ./pyproject.toml -r . -f json -o reports/bandit.json || true
          # Parse and display the output using our parser
          if [ -f reports/bandit.json ]; then
            python3 tools/parse_bandit.py reports/bandit.json >> $GITHUB_STEP_SUMMARY
            # Check exit code from parser (1 if high/medium severity issues found)
            if [ $? -eq 1 ]; then
              echo "Bandit found security issues. Failing job."
              exit 1
            fi
          else
            echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
            echo "❌ No bandit output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/bandit.json

      - name: Parse Results
        run: |
          uv run --only-group ci python tools/ci/ci.py artifacts collect

      - name: Generate Summary
        run: |
          uv run --only-group ci python tools/ci/ci.py summary generate --workflow sec-scan

      - name: Upload CI State
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-sec-scan-bandit
          path: ci-data/
          retention-days: 30

      - name: Finish Job
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow sec-scan --job bandit --status ${{ job.status }}

  trivy:
    if: |
      ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }} ||
      contains(github.ref, 'refs/heads/master') ||
      contains(github.ref, 'refs/heads/latest') ||
      contains(github.ref, 'refs/heads/BE-Master') ||
      contains(github.ref, 'refs/heads/BE-Prod') ||
      contains(github.ref, 'refs/heads/BE-Staging') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout (for logs/paths)
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Job
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow sec-scan --job trivy

      - name: Download docker image artifact from Build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: docker-image
          path: ./artifacts

      - name: Run Trivy scan and produce SARIF
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMG_TAR=$(ls ./artifacts/*.tar | head -n1)
            [ -f "$IMG_TAR" ] || (echo "image tar not found" && exit 1)
            docker run --rm -v "$PWD":/data aquasec/trivy:latest image --input "/data/$IMG_TAR" --format sarif --output /data/trivy-results.sarif
          else
            # Use the first tag from prep-build for local scan
            FIRST_TAG=$(echo "${{ inputs.tag_list }}" | awk '{print $1}')
            IMG="${{ inputs.github_owner }}/${{ inputs.github_repo }}:$FIRST_TAG"
            docker run --rm -v "$PWD":/data aquasec/trivy:latest image --input "${IMG}" --format sarif --output /data/trivy-results.sarif || true
          fi

      - name: Upload Trivy SARIF to Code Scanning
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy SARIF artifact
        if: ${{ hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Parse Results
        run: |
          uv run --only-group ci python tools/ci/ci.py artifacts collect

      - name: Generate Summary
        run: |
          uv run --only-group ci python tools/ci/ci.py summary generate --workflow sec-scan

      - name: Upload CI State
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-sec-scan-trivy
          path: ci-data/
          retention-days: 30

      - name: Finish Job
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow sec-scan --job trivy --status ${{ job.status }}