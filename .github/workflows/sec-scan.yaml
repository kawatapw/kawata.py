  finish:
    needs: [start, bandit] #  safety, trivy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bootstrap Timing
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI Tool
        run: |
          pip install -r tools/ci/requirements.txt
      - name: Download CI State
        uses: actions/download-artifact@v4
        with:
          name: ci-state-sec-scan
          path: ci-data/
          if-no-artifact-found: warn
      - name: Finish Workflow
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow sec-scan --status ${{ job.status }}