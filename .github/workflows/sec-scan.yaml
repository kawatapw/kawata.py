  bandit:
    needs: [start]
    if: |
      ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }} ||
      contains(github.ref, 'refs/heads/master') ||
      contains(github.ref, 'refs/heads/latest') ||
      contains(github.ref, 'refs/heads/BE-Master') ||
      contains(github.ref, 'refs/heads/BE-Prod') ||
      contains(github.ref, 'refs/heads/BE-Staging') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download CI State
        uses: actions/download-artifact@v4
        with:
          name: ci-state-sec-scan
          path: ci-data/
          if-no-artifact-found: warn

      - name: Start Job
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow sec-scan --job bandit

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run bandit (security lint)
        id: bandit
        run: |
          mkdir -p reports
          # Run bandit and capture output (configuration from pyproject.toml)
          uv run bandit -c ./pyproject.toml -r . -f json -o reports/bandit.json || true
          # Parse and display the output using our parser
          if [ -f reports/bandit.json ]; then
            python3 tools/parse_bandit.py reports/bandit.json >> $GITHUB_STEP_SUMMARY
            BANDIT_EXIT_CODE=$?
            # Check exit code from parser (1 if high/medium severity issues found)
            if [ $BANDIT_EXIT_CODE -eq 1 ]; then
              echo "Bandit found security issues. Failing job."
              exit 1
            fi
          else
            echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
            echo "❌ No bandit output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/bandit.json

      - name: Parse Results
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py artifacts collect

      - name: Generate Summary
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py summary generate --workflow sec-scan

      - name: Upload CI State
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-sec-scan-bandit
          path: ci-data/
          retention-days: 30

      - name: Finish Job
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow sec-scan --job bandit --status ${{ job.status }}

