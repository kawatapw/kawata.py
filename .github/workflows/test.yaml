  run-test-suite:
    needs: [start]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Job
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow test --job run-test-suite

      - name: Download docker image artifact (when triggered by Build)
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_call' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: docker-image
          path: ./artifacts
          retry-exit-code: 1
          retry-on: error

      - name: Load docker image (if artifact available)
        if: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_call' }}
        run: |
          IMG_TAR=$(ls ./artifacts/*.tar | head -n1 || true)
          if [ -n "$IMG_TAR" ]; then 
            docker load -i "$IMG_TAR"
            # Tag with the first tag from prep-build (usually short SHA) for consistency
            FIRST_TAG=$(echo "${{ inputs.tag_list }}" | awk '{print $1}')
            docker tag kawata.py:${GITHUB_SHA} kawata.py:$FIRST_TAG
            # Also tag as latest for the test
            docker tag kawata.py:${GITHUB_SHA} kawata.py:latest
          fi

      - name: Build application image (fallback - local)
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          set -euo pipefail
          GITHUB_OWNER="${{ inputs.github_owner }}"
          GITHUB_REPO="${{ inputs.github_repo }}"
          TAGS="${{ inputs.tag_list }}"
          TAG_ARGS=""
          for TAG in $TAGS; do
            TAG_ARGS="$TAG_ARGS -t ${GITHUB_OWNER}/${GITHUB_REPO}:$TAG"
          done
          docker build $TAG_ARGS .

      - name: Prepare test image tag
        id: test-tag
        run: |
          FIRST_TAG=$(echo "${{ inputs.tag_list }}" | awk '{print $1}')
          echo "tag=${{ inputs.github_owner }}/${{ inputs.github_repo }}:$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Start containers
        id: start-containers
        run: docker compose -f docker-compose.test.yml up --detach --wait --wait-timeout 30 bancho-test mysql-test redis-test
        env:
          TEST_IMAGE: ${{ steps.test-tag.outputs.tag }}

      - name: Run tests
        id: run-tests
        run: docker compose -f docker-compose.test.yml exec -T bancho-test /srv/root/scripts/run-tests.sh
        env:
          TEST_IMAGE: ${{ steps.test-tag.outputs.tag }}

      - name: Capture container logs on failure
        if: failure()
        run: |
          echo "=== Capturing container logs for debugging ==="
          mkdir -p /tmp/container-logs
          
          echo "Container status:"
          docker compose -f docker-compose.test.yml ps > /tmp/container-logs/container-status.txt 2>&1
          cat /tmp/container-logs/container-status.txt
          echo ""
          
          echo "=== bancho-test logs ==="
          docker compose -f docker-compose.test.yml logs bancho-test > /tmp/container-logs/bancho-test.log 2>&1 || true
          cat /tmp/container-logs/bancho-test.log
          echo ""
          
          echo "=== mysql-test logs ==="
          docker compose -f docker-compose.test.yml logs mysql-test > /tmp/container-logs/mysql-test.log 2>&1 || true
          cat /tmp/container-logs/mysql-test.log
          echo ""
          
          echo "=== redis-test logs ==="
          docker compose -f docker-compose.test.yml logs redis-test > /tmp/container-logs/redis-test.log 2>&1 || true
          cat /tmp/container-logs/redis-test.log
          echo ""
          
          echo "=== All container logs ==="
          docker compose -f docker-compose.test.yml logs > /tmp/container-logs/all-containers.log 2>&1 || true
          cat /tmp/container-logs/all-containers.log

      - name: Archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs-${{ github.run_id }}
          path: |
            /tmp/container-logs/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage/

      - name: Parse Results
        run: |
          uv run --only-group ci python tools/ci/ci.py artifacts collect
      
      - name: Generate Summary
        run: |
          uv run --only-group ci python tools/ci/ci.py summary generate --workflow test
      
      - name: Finish Job
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow test --job run-test-suite --status ${{ job.status }}
      
      - name: Upload CI State
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-test
          path: ci-data/
          retention-days: 30

  finish:
    runs-on: ubuntu-latest
    if: always()
    needs: [start, run-test-suite]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bootstrap Timing
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI Tool
        run: |
          pip install -r tools/ci/requirements.txt
      - name: Finish Workflow
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow test --status ${{ job.status }}