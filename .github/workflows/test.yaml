name: Test Application Code

on:
  push:
  pull_request:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:

env:
  APP_HOST: "0.0.0.0"
  APP_PORT: "10000"
  AUTOMATICALLY_REPORT_PROBLEMS: "False"
  LOG_WITH_COLORS: "False"
  COMMAND_PREFIX: "!"
  DATA_DIRECTORY: "not relevant"
  DB_HOST: "mysql-test"
  DB_NAME: "bancho"
  DB_PASS: "lol123"
  DB_PORT: "3306"
  DB_USER: "cmyui"
  DEBUG: "True"
  DEVELOPER_MODE: "True"
  DISALLOWED_NAMES: "mrekk,vaxei,btmc,cookiezi"
  DISALLOWED_PASSWORDS: "password,abc123"
  DISALLOW_OLD_CLIENTS: "False"
  DOMAIN: "lokiverse.com"
  MENU_ICON_URL: "https://akatsuki.pw/static/logos/logo_ingame.png"
  MENU_ONCLICK_URL: "https://akatsuki.pw"
  MIRROR_DOWNLOAD_ENDPOINT: "https://catboy.best/d"
  MIRROR_SEARCH_ENDPOINT: "https://catboy.best/api/search"
  PP_CACHED_ACCS: "90,95,98,99,100"
  REDIRECT_OSU_URLS: "True"
  REDIS_DB: "0"
  REDIS_HOST: "redis"
  REDIS_PASS: "pass"
  REDIS_PORT: "6379"
  REDIS_USER: "default"
  SEASONAL_BGS: "https://akatsuki.pw/static/flower.png,https://i.cmyui.xyz/nrMT4V2RR3PR.jpeg"
  SSL_CERT_PATH: "not relevant"
  SSL_KEY_PATH: "not relevant"
  DB_USE_SSL: "false"

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  run-test-suite:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download docker image artifact (when triggered by Build)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: docker-image
          path: ./artifacts
          # Attempt to retry download if artifact isn't ready yet
          # (GitHub artifacts can take a moment to propagate)
          retry-exit-code: 1
          retry-on: error

      - name: Load docker image (if artifact available)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          IMG_TAR=$(ls ./artifacts/*.tar | head -n1 || true)
          if [ -n "$IMG_TAR" ]; then 
            docker load -i "$IMG_TAR"
            # Tag the loaded image as kawatapy:latest so compose finds it locally
            # The build workflow saves it as kawata.py:${GITHUB_SHA}
            docker tag kawata.py:${{ github.sha }} kawatapy:latest
          fi

      - name: Build application image (fallback - local)
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          set -euo pipefail
          IMAGE_NAME="kawatapy"
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_TAG="${BRANCH//\//-}"
          TAGS=("$SHORT_SHA" "$BRANCH_TAG")
          [ "$BRANCH" = "master" ] && TAGS+=("latest")
          [ "$BRANCH" = "BE-Master" ] && TAGS+=("prod")
          [ "$BRANCH" = "BE-Staging" ] && TAGS+=("staging")
          [ "$BRANCH" = "BE-Dev" ] && TAGS+=("dev")
          TAGS+=("ci-${SHORT_SHA}")
          TAG_ARGS=""
          for t in "${TAGS[@]}"; do TAG_ARGS="${TAG_ARGS} -t ${IMAGE_NAME}:${t}"; done
          docker build ${TAG_ARGS} .

      - name: Start containers
        run: docker compose -f docker-compose.test.yml up --detach --wait --wait-timeout 30 bancho-test mysql-test redis-test

      - name: Run tests
        run: docker compose -f docker-compose.test.yml exec -T bancho-test /srv/root/scripts/run-tests.sh

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/