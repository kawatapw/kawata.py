name: Test Codebase

on:
  push:
  pull_request:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:

env:
  APP_HOST: "0.0.0.0"
  APP_PORT: "10000"
  AUTOMATICALLY_REPORT_PROBLEMS: "False"
  LOG_WITH_COLORS: "False"
  COMMAND_PREFIX: "!"
  DATA_DIRECTORY: "/srv/root/.data"
  DB_HOST: "mysql-test"
  DB_NAME: "bancho"
  DB_PASS: "lol123"
  DB_PORT: "3306"
  DB_USER: "cmyui"
  DEBUG_LEVEL: "3"
  DEBUG_FOCUS: "all"
  DEVELOPER_MODE: "True"
  DISALLOWED_NAMES: "mrekk,vaxei,btmc,cookiezi"
  DISALLOWED_PASSWORDS: "password,abc123"
  DISALLOW_OLD_CLIENTS: "False"
  DOMAIN: "cmyui.xyz"
  MENU_ICON_URL: "https://akatsuki.pw/static/logos/logo_ingame.png"
  MENU_ONCLICK_URL: "https://akatsuki.pw"
  MIRROR_DOWNLOAD_ENDPOINT: "https://catboy.best/d"
  MIRROR_SEARCH_ENDPOINT: "https://catboy.best/api/search"
  PP_CACHED_ACCS: "90,95,98,99,100"
  REDIRECT_OSU_URLS: "True"
  REDIS_DB: "0"
  REDIS_HOST: "redis"
  REDIS_PASS: "pass"
  REDIS_PORT: "6379"
  REDIS_USER: "default"
  SEASONAL_BGS: "https://akatsuki.pw/static/flower.png,https://i.cmyui.xyz/nrMT4V2RR3PR.jpeg"
  SSL_CERT_PATH: "/srv/root/certs/fullchain.crt"
  SSL_KEY_PATH: "/srv/root/certs/privkey.pem"
  DB_USE_SSL: "false"

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  run-test-suite:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download docker image artifact (when triggered by Build)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: docker-image
          path: ./artifacts
          retry-exit-code: 1
          retry-on: error

      - name: Load docker image (if artifact available)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          IMG_TAR=$(ls ./artifacts/*.tar | head -n1 || true)
          if [ -n "$IMG_TAR" ]; then 
            docker load -i "$IMG_TAR"
            # Tag with the first tag from prep-build (usually short SHA) for consistency
            FIRST_TAG=$(echo "${{ needs.prepare.outputs.tag_list }}" | awk '{print $1}')
            docker tag kawata.py:${GITHUB_SHA} kawata.py:$FIRST_TAG
            # Also tag as latest for the test
            docker tag kawata.py:${GITHUB_SHA} kawata.py:latest
          fi

      - name: Build application image (fallback - local)
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          set -euo pipefail
          GITHUB_OWNER="${{ needs.prepare.outputs.github_owner }}"
          GITHUB_REPO="${{ needs.prepare.outputs.github_repo }}"
          TAGS="${{ needs.prepare.outputs.tag_list }}"
          TAG_ARGS=""
          for TAG in $TAGS; do
            TAG_ARGS="$TAG_ARGS -t ${GITHUB_OWNER}/${GITHUB_REPO}:$TAG"
          done
          docker build $TAG_ARGS .

      - name: Prepare test image tag
        id: test-tag
        run: |
          FIRST_TAG=$(echo "${{ needs.prepare.outputs.tag_list }}" | awk '{print $1}')
          echo "tag=${{ needs.prepare.outputs.github_owner }}/${{ needs.prepare.outputs.github_repo }}:$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Start containers
        id: start-containers
        run: docker compose -f docker-compose.test.yml up --detach --wait --wait-timeout 30 bancho-test mysql-test redis-test
        env:
          TEST_IMAGE: ${{ steps.test-tag.outputs.tag }}

      - name: Run tests
        id: run-tests
        run: docker compose -f docker-compose.test.yml exec -T bancho-test /srv/root/scripts/run-tests.sh
        env:
          TEST_IMAGE: ${{ steps.test-tag.outputs.tag }}

      - name: Capture container logs on failure
        if: failure()
        run: |
          echo "=== Capturing container logs for debugging ==="
          mkdir -p /tmp/container-logs
          
          echo "Container status:"
          docker compose -f docker-compose.test.yml ps > /tmp/container-logs/container-status.txt 2>&1
          cat /tmp/container-logs/container-status.txt
          echo ""
          
          echo "=== bancho-test logs ==="
          docker compose -f docker-compose.test.yml logs bancho-test > /tmp/container-logs/bancho-test.log 2>&1 || true
          cat /tmp/container-logs/bancho-test.log
          echo ""
          
          echo "=== mysql-test logs ==="
          docker compose -f docker-compose.test.yml logs mysql-test > /tmp/container-logs/mysql-test.log 2>&1 || true
          cat /tmp/container-logs/mysql-test.log
          echo ""
          
          echo "=== redis-test logs ==="
          docker compose -f docker-compose.test.yml logs redis-test > /tmp/container-logs/redis-test.log 2>&1 || true
          cat /tmp/container-logs/redis-test.log
          echo ""
          
          echo "=== All container logs ==="
          docker compose -f docker-compose.test.yml logs > /tmp/container-logs/all-containers.log 2>&1 || true
          cat /tmp/container-logs/all-containers.log

      - name: Archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs-${{ github.run_id }}
          path: |
            /tmp/container-logs/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage/