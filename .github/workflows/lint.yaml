name: Lint

on:
  push:
    paths:
      - "**.py"
  pull_request:
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  mypy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install poetry
        run: python -m pip install --upgrade poetry wheel
      - name: Update poetry.lock
        run: poetry lock || true
      - name: Install dependencies
        run: poetry install --no-root --with dev || true
      - name: Run mypy
        run: poetry run mypy . || true