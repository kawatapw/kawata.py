name: Lint

on:
  push:
    paths:
      - "**.py"
  pull_request:
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install poetry
        run: python -m pip install --upgrade poetry wheel

      - name: Update poetry.lock
        run: poetry lock || true

      - name: Install dependencies
        run: poetry install --no-root --with dev || true

      - name: Prepare reports dir
        run: mkdir -p reports

      - name: Run mypy
        id: mypy
        continue-on-error: true
        run: |
          poetry run mypy . > reports/mypy.txt 2>&1 || true

      - name: Run flake8
        id: flake8
        continue-on-error: true
        run: |
          poetry run flake8 . --format=default > reports/flake8.txt 2>&1 || true

      - name: Run bandit (security lint)
        id: bandit
        continue-on-error: true
        run: |
          poetry run bandit -r . -f json -o reports/bandit.json || true

      - name: Run pytest with coverage (junit + coverage.xml)
        id: pytest
        continue-on-error: true
        run: |
          poetry run pytest --maxfail=1 --disable-warnings -q \
            --junitxml=reports/junit.xml || true
          # coverage xml if coverage plugin configured
          poetry run pytest --maxfail=1 --disable-warnings -q --cov=./ --cov-report=xml:reports/coverage.xml || true

      - name: Summarize results to job summary
        if: always()
        run: |
          echo "## Lint & Test Report" >> $GITHUB_STEP_SUMMARY
          for f in reports/*; do
            echo "- $(basename "$f")" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: reports/**
