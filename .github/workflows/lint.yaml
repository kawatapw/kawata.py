name: Lint

on:
  pull_request:
    paths:
      - "**.py"
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  mypy:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run mypy
        id: mypy
        run: |
          mkdir -p reports
          # Run mypy and capture both stdout and stderr
          uv run mypy . > reports/mypy.txt 2>&1 || true
          # Display the output
          if [ -f reports/mypy.txt ]; then
            echo "## Mypy Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/mypy.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Check if mypy found any errors
            if grep -q "error:" reports/mypy.txt; then
              echo "Mypy found errors. Failing job."
              exit 1
            fi
          else
            echo "## Mypy Results" >> $GITHUB_STEP_SUMMARY
            echo "No mypy output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload mypy report
        uses: actions/upload-artifact@v7
        with:
          name: mypy-report
          path: reports/mypy.txt

  ruff:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python # Weirdly fixes issues...
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff
        id: ruff
        run: |
          mkdir -p reports
          # Run ruff check and capture output
          uv run ruff check . > reports/ruff.txt 2>&1 || true
          # Run ruff format check and capture output
          uv run ruff format . --check > reports/ruff-format.txt 2>&1 || true
          # Display the output
          if [ -f reports/ruff.txt ]; then
            echo "## Ruff Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/ruff-format.txt ]; then
            echo "## Ruff Format Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff-format.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Check if ruff found any errors
          if grep -q "error\|E\|F" reports/ruff.txt || grep -q "would reformat\|error" reports/ruff-format.txt; then
            echo "Ruff found errors. Failing job."
            exit 1
          fi

      - name: Upload ruff reports
        uses: actions/upload-artifact@v7
        with:
          name: ruff-reports
          path: |
            reports/ruff.txt
            reports/ruff-format.txt

  bandit:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run bandit (security lint)
        id: bandit
        run: |
          mkdir -p reports
          # Run bandit and capture output (configuration from pyproject.toml)
          uv run bandit -c ./pyproject.toml -r . -f json -o reports/bandit.json || true
          # Parse and display the output using our parser
          if [ -f reports/bandit.json ]; then
            python3 tools/parse_bandit.py reports/bandit.json >> $GITHUB_STEP_SUMMARY
            # Check exit code from parser (1 if high/medium severity issues found)
            if [ $? -eq 1 ]; then
              echo "Bandit found security issues. Failing job."
              exit 1
            fi
          else
            echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
            echo "❌ No bandit output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/bandit.json

  pytest:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the lint job if pytest fails
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download docker image artifact (when triggered by Build)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: docker-image
          path: ./artifacts
          retry-exit-code: 1
          retry-on: error

      - name: Load docker image (if artifact available)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          IMG_TAR=$(ls ./artifacts/*.tar | head -n1 || true)
          if [ -n "$IMG_TAR" ]; then 
            docker load -i "$IMG_TAR"
            # Tag with the first tag from prep-build (usually short SHA) for consistency
            FIRST_TAG=$(echo "${{ needs.prepare.outputs.tag_list }}" | awk '{print $1}')
            docker tag kawata.py:${GITHUB_SHA} kawata.py:$FIRST_TAG
            # Also tag as latest for the test
            docker tag kawata.py:${GITHUB_SHA} kawata.py:latest
          fi

      - name: Build application image (fallback - local)
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          set -euo pipefail
          GITHUB_OWNER="${{ needs.prepare.outputs.github_owner }}"
          GITHUB_REPO="${{ needs.prepare.outputs.github_repo }}"
          TAGS="${{ needs.prepare.outputs.tag_list }}"
          TAG_ARGS=""
          for TAG in $TAGS; do
            TAG_ARGS="$TAG_ARGS -t ${GITHUB_OWNER}/${GITHUB_REPO}:$TAG"
          done
          docker build $TAG_ARGS .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Prepare test image tag
        id: test-tag
        run: |
          FIRST_TAG=$(echo "${{ needs.prepare.outputs.tag_list }}" | awk '{print $1}')
          echo "tag=${{ needs.prepare.outputs.github_owner }}/${{ needs.prepare.outputs.github_repo }}:$FIRST_TAG" >> $GITHUB_OUTPUT

      - name: Start containers
        id: start-containers
        run: docker compose -f docker-compose.test.yml up --detach --wait --wait-timeout 30 bancho-test mysql-test redis-test
        env:
          TEST_IMAGE: ${{ steps.test-tag.outputs.tag }}

      - name: Run pytest with coverage (junit + coverage.xml)
        id: pytest
        run: |
          mkdir -p reports
          # Run pytest and capture output
          uv run pytest --maxfail=1 --disable-warnings -q \
            --junitxml=reports/junit.xml 2>&1 || true
          # coverage xml if coverage plugin configured
          uv run pytest --maxfail=1 --disable-warnings -q --cov=./ --cov-report=xml:reports/coverage.xml 2>&1 || true
          # Parse pytest output to determine pass/fail status
          if [ -f reports/junit.xml ]; then
            echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo '```xml' >> $GITHUB_STEP_SUMMARY
            cat reports/junit.xml >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Check if pytest found any failures
            if grep -q "failures=\"[1-9]" reports/junit.xml || grep -q "errors=\"[1-9]" reports/junit.xml; then
              echo "Pytest found failures. Continuing due to continue-on-error setting."
            fi
          else
            echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo "No pytest output file generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload pytest reports
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            reports/coverage.xml

      - name: Stop containers
        if: always()
        run: docker compose down
  summarize:
    needs: [mypy, ruff, bandit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v8
        with:
          path: reports

      - name: Summarize results to job summary
        run: |
          echo "## Lint & Test Report" >> $GITHUB_STEP_SUMMARY
          # List all downloaded files
          echo "### Downloaded Files" >> $GITHUB_STEP_SUMMARY
          find reports -type f -name "*" | while read f; do
            echo "- $f" >> $GITHUB_STEP_SUMMARY
          done
          
          # Add summary for each report type
          echo "### Mypy Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/mypy.txt ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/mypy.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No mypy report found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Ruff Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/ruff.txt ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No ruff report found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Bandit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/bandit.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/bandit.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No bandit report found" >> $GITHUB_STEP_SUMMARY
          fi