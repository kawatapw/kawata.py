name: Lint

on:
  push:
    paths:
      - "**.py"
  pull_request:
    paths:
      - "**.py"
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  mypy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run mypy
        id: mypy
        run: |
          mkdir -p reports
          uv run mypy . > reports/mypy.txt 2>&1
          # Parse mypy output to determine pass/fail status
          if [ -f reports/mypy.txt ]; then
            echo "## Mypy Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/mypy.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Check if mypy found any errors
          if grep -q "error:" reports/mypy.txt; then
            echo "Mypy found errors. Failing job."
            exit 1
          fi

      - name: Upload mypy report
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: reports/mypy.txt

  ruff:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff
        id: ruff
        run: |
          mkdir -p reports
          uv run ruff check . > reports/ruff.txt 2>&1
          uv run ruff format . --check > reports/ruff-format.txt 2>&1
          # Parse ruff output to determine pass/fail status
          if [ -f reports/ruff.txt ]; then
            echo "## Ruff Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/ruff-format.txt ]; then
            echo "## Ruff Format Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff-format.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Check if ruff found any errors
          if grep -q "error\|E\|F" reports/ruff.txt || grep -q "would reformat\|error" reports/ruff-format.txt; then
            echo "Ruff found errors. Failing job."
            exit 1
          fi

      - name: Upload ruff reports
        uses: actions/upload-artifact@v4
        with:
          name: ruff-reports
          path: |
            reports/ruff.txt
            reports/ruff-format.txt

  bandit:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run bandit (security lint)
        id: bandit
        run: |
          mkdir -p reports
          uv run bandit -r . -f json -o reports/bandit.json
          # Parse bandit output to determine pass/fail status
          if [ -f reports/bandit.json ]; then
            echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/bandit.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Check if bandit found any issues
          if grep -q '"SEVERITY": "HIGH"' reports/bandit.json || grep -q '"SEVERITY": "MEDIUM"' reports/bandit.json; then
            echo "Bandit found security issues. Failing job."
            exit 1
          fi

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit.json

  pytest:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_HOST: "0.0.0.0"
      APP_PORT: "10000"
      AUTOMATICALLY_REPORT_PROBLEMS: "False"
      LOG_WITH_COLORS: "False"
      COMMAND_PREFIX: "!"
      DATA_DIRECTORY: "/srv/root/.data"
      DB_HOST: "mysql-test"
      DB_NAME: "bancho"
      DB_PASS: "lol123"
      DB_PORT: "3306"
      DB_USER: "cmyui"
      DEBUG_LEVEL: "3"
      DEBUG_FOCUS: "all"
      DEVELOPER_MODE: "True"
      DISALLOWED_NAMES: "mrekk,vaxei,btmc,cookiezi"
      DISALLOWED_PASSWORDS: "password,abc123"
      DISALLOW_OLD_CLIENTS: "False"
      DOMAIN: "cmyui.xyz"
      MENU_ICON_URL: "https://akatsuki.pw/static/logos/logo_ingame.png"
      MENU_ONCLICK_URL: "https://akatsuki.pw"
      MIRROR_DOWNLOAD_ENDPOINT: "https://catboy.best/d"
      MIRROR_SEARCH_ENDPOINT: "https://catboy.best/api/search"
      PP_CACHED_ACCS: "90,95,98,99,100"
      REDIRECT_OSU_URLS: "True"
      REDIS_DB: "0"
      REDIS_HOST: "redis"
      REDIS_PASS: "pass"
      REDIS_PORT: "6379"
      REDIS_USER: "default"
      SEASONAL_BGS: "https://akatsuki.pw/static/flower.png,https://i.cmyui.xyz/nrMT4V2RR3PR.jpeg"
      SSL_CERT_PATH: "/srv/root/certs/fullchain.crt"
      SSL_KEY_PATH: "/srv/root/certs/privkey.pem"
      DB_USE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run pytest with coverage (junit + coverage.xml)
        id: pytest
        run: |
          mkdir -p reports
          uv run pytest --maxfail=1 --disable-warnings -q \
            --junitxml=reports/junit.xml
          # coverage xml if coverage plugin configured
          uv run pytest --maxfail=1 --disable-warnings -q --cov=./ --cov-report=xml:reports/coverage.xml
          # Parse pytest output to determine pass/fail status
          if [ -f reports/junit.xml ]; then
            echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo '```xml' >> $GITHUB_STEP_SUMMARY
            cat reports/junit.xml >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Check if pytest found any failures
          if grep -q "failures=\"[1-9]" reports/junit.xml || grep -q "errors=\"[1-9]" reports/junit.xml; then
            echo "Pytest found failures. Failing job."
            exit 1
          fi

      - name: Upload pytest reports
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            reports/coverage.xml

  summarize:
    needs: [mypy, ruff, bandit, pytest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Summarize results to job summary
        run: |
          echo "## Lint & Test Report" >> $GITHUB_STEP_SUMMARY
          for f in reports/**/*; do
            if [ -f "$f" ]; then
              echo "- $(basename "$f")" >> $GITHUB_STEP_SUMMARY
            fi
          done
          # Add summary for pytest results
          if [ -f reports/pytest-reports/junit.xml ]; then
            echo "## Pytest Summary" >> $GITHUB_STEP_SUMMARY
            echo "JUnit XML report generated at reports/pytest-reports/junit.xml" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/pytest-reports/coverage.xml ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated at reports/pytest-reports/coverage.xml" >> $GITHUB_STEP_SUMMARY
          fi