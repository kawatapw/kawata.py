name: Lint

on:
  push:
    #paths:
    #  - "**.py"
  pull_request:
    paths:
      - "**.py"
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  mypy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run mypy
        id: mypy
        run: |
          mkdir -p reports
          # Run mypy and capture both stdout and stderr
          uv run mypy . > reports/mypy.txt 2>&1 || true
          # Display the output
          if [ -f reports/mypy.txt ]; then
            echo "## Mypy Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/mypy.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Check if mypy found any errors
            if grep -q "error:" reports/mypy.txt; then
              echo "Mypy found errors. Failing job."
              exit 1
            fi
          else
            echo "## Mypy Results" >> $GITHUB_STEP_SUMMARY
            echo "No mypy output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload mypy report
        uses: actions/upload-artifact@v7
        with:
          name: mypy-report
          path: reports/mypy.txt

  ruff:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff
        id: ruff
        run: |
          mkdir -p reports
          # Run ruff check and capture output
          uv run ruff check . > reports/ruff.txt 2>&1 || true
          # Run ruff format check and capture output
          uv run ruff format . --check > reports/ruff-format.txt 2>&1 || true
          # Display the output
          if [ -f reports/ruff.txt ]; then
            echo "## Ruff Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/ruff-format.txt ]; then
            echo "## Ruff Format Results" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff-format.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Check if ruff found any errors
          if grep -q "error\|E\|F" reports/ruff.txt || grep -q "would reformat\|error" reports/ruff-format.txt; then
            echo "Ruff found errors. Failing job."
            exit 1
          fi

      - name: Upload ruff reports
        uses: actions/upload-artifact@v7
        with:
          name: ruff-reports
          path: |
            reports/ruff.txt
            reports/ruff-format.txt

  bandit:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run bandit (security lint)
        id: bandit
        run: |
          mkdir -p reports
          # Run bandit and capture output (configuration from pyproject.toml)
          uv run bandit -c /srv/root/pyproject.toml -r . -f json -o reports/bandit.json || true
          # Parse and display the output using our parser
          if [ -f reports/bandit.json ]; then
            python3 tools/parse_bandit.py reports/bandit.json >> $GITHUB_STEP_SUMMARY
            # Check exit code from parser (1 if high/medium severity issues found)
            if [ $? -eq 1 ]; then
              echo "Bandit found security issues. Failing job."
              exit 1
            fi
          else
            echo "## Bandit Results" >> $GITHUB_STEP_SUMMARY
            echo "❌ No bandit output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/bandit.json

  pytest:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_HOST: "0.0.0.0"
      APP_PORT: "10000"
      TZ: "America/Chicago"
      SERVICE_NAME: "kawata"
      CONTAINER_NAME: "bancho"
      CONTAINER_VERSION: "BE-Test"
      GITHUB_OWNER: "kawatapw"
      GITHUB_REPO: "kawata.py"
      CHEAT_SERVER: "true"
      CLIENT_VERSION: ""
      DOMAIN: "cmyui.xyz"
      USINGROOTDOMAIN: "False"
      DB_HOST: "mysql-test"
      DB_NAME: "bancho"
      DB_PASS: "lol123"
      DB_PORT: "3306"
      DB_USER: "cmyui"
      REDIS_DB: "0"
      REDIS_HOST: "redis"
      REDIS_PASS: "pass"
      REDIS_PORT: "6379"
      REDIS_USER: "default"
      OSU_API_KEY: ""
      BOT_API_KEY: ""
      DATA_DIRECTORY: "/srv/root/.data"
      SSL_CERT_PATH: "/srv/root/certs/fullchain.crt"
      SSL_KEY_PATH: "/srv/root/certs/privkey.pem"
      MIRROR_SEARCH_ENDPOINT: "https://catboy.best/api/search"
      MIRROR_DOWNLOAD_ENDPOINT: "https://catboy.best/d"
      COMMAND_PREFIX: "!"
      REQUEST_PENDING_ONLY: "True"
      SEASONAL_BGS: "https://akatsuki.pw/static/flower.png,https://i.cmyui.xyz/nrMT4V2RR3PR.jpeg"
      MENU_ICON_URL: "https://akatsuki.pw/static/logos/logo_ingame.png"
      MENU_ONCLICK_URL: "https://akatsuki.pw"
      DATADOG_API_KEY: ""
      DATADOG_APP_KEY: ""
      DEBUG_LEVEL: "3"
      DEBUG_FOCUS: "all"
      REDIRECT_OSU_URLS: "True"
      PP_CACHED_ACCS: "90,95,98,99,100"
      DISALLOWED_NAMES: "mrekk,vaxei,btmc,cookiezi"
      DISALLOWED_PASSWORDS: "password,abc123"
      DISALLOW_OLD_CLIENTS: "False"
      DISALLOW_INGAME_REGISTRATION: "True"
      DISCORD_AUDIT_LOG_WEBHOOK: ""
      DISCORD_INVITE: "https://discord.gg/ShEQgUx"
      AUTOMATICALLY_REPORT_PROBLEMS: "False"
      LOG_WITH_COLORS: "False"
      TUNNEL_TOKEN: ""
      DEVELOPER_MODE: "True"
      DB_USE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for proper diff analysis

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run pytest with coverage (junit + coverage.xml)
        id: pytest
        run: |
          mkdir -p reports
          # Run pytest and capture output
          uv run pytest --maxfail=1 --disable-warnings -q \
            --junitxml=reports/junit.xml 2>&1 || true
          # coverage xml if coverage plugin configured
          uv run pytest --maxfail=1 --disable-warnings -q --cov=./ --cov-report=xml:reports/coverage.xml 2>&1 || true
          # Parse pytest output to determine pass/fail status
          if [ -f reports/junit.xml ]; then
            echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo '```xml' >> $GITHUB_STEP_SUMMARY
            cat reports/junit.xml >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Check if pytest found any failures
            if grep -q "failures=\"[1-9]" reports/junit.xml || grep -q "errors=\"[1-9]" reports/junit.xml; then
              echo "Pytest found failures. Failing job."
              exit 1
            fi
          else
            echo "## Pytest Results" >> $GITHUB_STEP_SUMMARY
            echo "No pytest output file generated" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload pytest reports
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            reports/coverage.xml

  summarize:
    needs: [mypy, ruff, bandit, pytest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v8
        with:
          path: reports

      - name: Summarize results to job summary
        run: |
          echo "## Lint & Test Report" >> $GITHUB_STEP_SUMMARY
          # List all downloaded files
          echo "### Downloaded Files" >> $GITHUB_STEP_SUMMARY
          find reports -type f -name "*" | while read f; do
            echo "- $f" >> $GITHUB_STEP_SUMMARY
          done
          
          # Add summary for each report type
          echo "### Mypy Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/mypy.txt ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/mypy.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No mypy report found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Ruff Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/ruff.txt ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat reports/ruff.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No ruff report found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Bandit Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/bandit.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat reports/bandit.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No bandit report found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "### Pytest Results" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/junit.xml ]; then
            echo '```xml' >> $GITHUB_STEP_SUMMARY
            cat reports/junit.xml >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No pytest report found" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f reports/coverage.xml ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report generated at reports/coverage.xml" >> $GITHUB_STEP_SUMMARY
          fi