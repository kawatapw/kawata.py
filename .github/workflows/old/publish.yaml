name: Push to Docker Hub

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "The version from project"
        required: true
        type: string
      tag_list:
        description: "Space-separated list of tags"
        required: true
        type: string
      github_owner:
        description: "The GitHub owner"
        required: true
        type: string
      github_repo:
        description: "The GitHub repo"
        required: true
        type: string

jobs:
  push:
    if: |
      ${{ github.event_name != 'workflow_run' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }} ||
      contains(github.ref, 'refs/heads/master') ||
      contains(github.ref, 'refs/heads/latest') ||
      contains(github.ref, 'refs/heads/BE-Master') ||
      contains(github.ref, 'refs/heads/BE-Prod') ||
      contains(github.ref, 'refs/heads/BE-Staging') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start Job
        run: |
          chmod +x tools/ci/scripts/ci-bootstrap.sh
          tools/ci/scripts/ci-bootstrap.sh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv sync --only-group ci
          uv run --only-group ci python tools/ci/ci.py workflow start --workflow publish --job push

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          TAGS=""
          for TAG in ${{ inputs.tag_list }}; do
            TAGS="$TAGS$DOCKER_USER/kawata.py:$TAG\n"
          done
          # Use heredoc to handle newlines properly
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Parse Results
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py artifacts collect

      - name: Generate Summary
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py summary generate --workflow publish

      - name: Upload CI State
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-state-publish
          path: ci-data/
          retention-days: 30

      - name: Finish Job
        if: always()
        run: |
          uv run --only-group ci python tools/ci/ci.py workflow finish --workflow publish --job push --status ${{ job.status }}
