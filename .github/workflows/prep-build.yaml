name: Prepare Build

on:
  workflow_call:
    outputs:
      version:
        description: "The version from project"
        value: ${{ jobs.prepare.outputs.version }}
      tag_list:
        description: "Space-separated list of tags"
        value: ${{ jobs.prepare.outputs.tag_list }}
      github_owner:
        description: "The GitHub owner"
        value: ${{ jobs.prepare.outputs.github_owner }}
      github_repo:
        description: "The GitHub repo"
        value: ${{ jobs.prepare.outputs.github_repo }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag_list: ${{ steps.set.outputs.tag_list }}
      github_owner: ${{ steps.set.outputs.github_owner }}
      github_repo: ${{ steps.set.outputs.github_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set
        name: Prepare version + tags
        run: |
          set -euo pipefail
          # Install uv
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Get version from pyproject.toml
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF#refs/heads/}
          BRANCH_TAG=${BRANCH//\//-}
          
          # Define base tags
          TAGS="$SHORT_SHA $BRANCH_TAG"
          
          # Add specific tags based on branch
          # BE-Master is production - add latest and prod
          if [ "$BRANCH" = "BE-Master" ]; then TAGS="$TAGS latest prod"; fi
          # BE-Staging is staging - add staging
          if [ "$BRANCH" = "BE-Staging" ]; then TAGS="$TAGS staging"; fi
          # BE-Dev is development - add dev
          if [ "$BRANCH" = "BE-Dev" ]; then TAGS="$TAGS dev"; fi
          # Master branch for fork compatibility - add latest
          if [ "$BRANCH" = "master" ]; then TAGS="$TAGS latest"; fi
          
          # Always add ci short sha
          TAGS="$TAGS ci-${SHORT_SHA}"
          
          # Set outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_list=$TAGS" >> $GITHUB_OUTPUT
          echo "github_owner=kawatapw" >> $GITHUB_OUTPUT
          echo "github_repo=kawata.py" >> $GITHUB_OUTPUT