name: Build and Publish Docker Image

on:
  push:
    branches: ["master", "BE-Master", "BE-Staging", "BE-Dev", "hina/updateV2"]
    paths-ignore: ["**.md", "ext/**"]
    tags:
      - 'v*'
  pull_request:
    branches: ["master", "BE-Master", "BE-Staging", "BE-Dev", "hina/updateV2"]
    paths-ignore: ["**.md", "ext/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Extract version from Poetry
        id: poetry_version
        run: |
          pip install poetry
          poetry lock
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          # Use OCI for multi-platform support
          outputs: type=oci,dest=/tmp/docker-oci
          tags: kawata.py:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker
          path: /tmp/docker-oci

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/BE-Master' || github.ref == 'refs/heads/BE-Staging' || github.ref == 'refs/heads/BE-Dev' || github.ref == 'refs/heads/hina/updateV2' }}
    
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kawata.py:${{ github.sha }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kawata.py:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to Code Scanning (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy SARIF as workflow artifact (view/download)
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  test:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/BE-Master' || github.ref == 'refs/heads/BE-Staging' || github.ref == 'refs/heads/BE-Dev' || github.ref == 'refs/heads/hina/updateV2' }}
    
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kawata.py:${{ github.sha }}
          cache-from: type=gha

      - name: Test container
        run: |
          echo "Not implemented yet - skipping tests"

  release:
    needs: [build, security-scan, test]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/BE-Master' || startsWith(github.ref, 'refs/tags/v') }}
    
    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          fetch-depth: 0

      - name: Extract version from Poetry
        id: poetry_version
        run: |
          pip install poetry
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Generate source code archive
        run: |
          tar -czf source-code.tar.gz --exclude='.git' --exclude='*.tar.gz' .
          echo "SOURCE_CODE=source-code.tar.gz" >> $GITHUB_ENV

      - name: Download Trivy SARIF artifact
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: ./trivy

      - name: Generate release notes
        id: release_notes
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Generate detailed release notes
          if [ -n "$PREV_TAG" ]; then
            RELEASE_NOTES="## Changes since $PREV_TAG\n\n"
            RELEASE_NOTES+="### Commits\n"
            RELEASE_NOTES+=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
            RELEASE_NOTES+="\n\n### Contributors\n"
            RELEASE_NOTES+=$(git log --pretty=format:"- %an" $PREV_TAG..HEAD | sort | uniq)
          else
            RELEASE_NOTES="## Initial Release\n\n"
            RELEASE_NOTES+="### Features\n"
            RELEASE_NOTES+=$(git log --pretty=format:"- %s" -10)
          fi
          
          # Escape for GitHub Actions
          RELEASE_NOTES="${RELEASE_NOTES//'%'/'%25'}"
          RELEASE_NOTES="${RELEASE_NOTES//$'\n'/'%0A'}"
          RELEASE_NOTES="${RELEASE_NOTES//$'\r'/'%0D'}"
          
          echo "release_notes=$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "Generated release notes:"
          echo "$RELEASE_NOTES"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.poetry_version.outputs.version }}
          name: Release v${{ steps.poetry_version.outputs.version }}
          body: |
            ## Release v${{ steps.poetry_version.outputs.version }}
            
            ### Docker Images
            - `docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ steps.poetry_version.outputs.version }}`
            - `docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:latest`
            
            ### Changes
            ${{ steps.release_notes.outputs.release_notes }}
            
            ### Installation
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ steps.poetry_version.outputs.version }}
            docker run -d --name kawata ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ steps.poetry_version.outputs.version }}
            ```
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/BE-Master' }}
          generate_release_notes: true
          files: |
            source-code.tar.gz
            trivy/trivy-results.sarif

  push-to-docker-hub:
    runs-on: ubuntu-latest
    needs: [build, security-scan, test]
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/BE-Master' || github.ref == 'refs/heads/BE-Staging' || github.ref == 'refs/heads/BE-Dev' || github.ref == 'refs/heads/hina/updateV2' }}
    
    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: docker
          path: /tmp/docker-oci

      - name: Extract version from Poetry
        id: poetry_version
        run: |
          pip install poetry
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ steps.poetry_version.outputs.version }}
            ${{ github.ref == 'refs/heads/BE-Master' && format('{0}/kawata.py:prod', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ github.ref == 'refs/heads/BE-Staging' && format('{0}/kawata.py:staging', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ github.ref == 'refs/heads/BE-Dev' && format('{0}/kawata.py:dev', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ github.ref == 'refs/heads/master' && format('{0}/kawata.py:stable', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-docker-hub-description:
    runs-on: ubuntu-latest
    needs: push-to-docker-hub
    if: ${{ github.ref == 'refs/heads/BE-Master' }}
    
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Extract version from Poetry
        id: poetry_version
        run: |
          pip install poetry
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py
          short-description: "kawata.py - Python-based osu! server management"
          readme-filepath: "./README.md"

  discord-notify:
    runs-on: ubuntu-latest
    needs: [build, security-scan, test, release, push-to-docker-hub, update-docker-hub-description]
    if: ${{ always() && (needs.release.result == 'success' ) }}
    
    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          fetch-depth: 0

      - name: Extract version from Poetry
        id: poetry_version
        run: |
          pip install poetry
          poetry lock
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Send Discord notification (Success)
        if: ${{ needs.release.result == 'success' }}
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            {
              "embeds": [
                {
                  "title": "✅ [kawata.py](http://_vscodecontentref_/0) Release Published",
                  "description": "A new version of [kawata.py](http://_vscodecontentref_/1) has been successfully released and published to Docker Hub.",
                  "color": 3066993,
                  "fields": [
                    {
                      "name": "Version",
                      "value": "${{ steps.poetry_version.outputs.version }}",
                      "inline": true
                    },
                    {
                      "name": "Branch",
                      "value": "${{ github.ref_name }}",
                      "inline": true
                    },
                    {
                      "name": "Docker Image",
                      "value": "`${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ steps.poetry_version.outputs.version }}`",
                      "inline": false
                    },
                    {
                      "name": "Release URL",
                      "value": "${{ github.event.compare }}",
                      "inline": false
                    }
                  ],
                  "timestamp": "${{ github.event.head_commit.timestamp }}",
                  "footer": {
                    "text": "kawata.py CI/CD Pipeline"
                  }
                }
              ]
            }

      - name: Send Discord notification (Failure)
        if: ${{ needs.release.result == 'failure' }}
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            {
              "embeds": [
                {
                  "title": "❌ [kawata.py](http://_vscodecontentref_/2) Release Failed",
                  "description": "The release process failed. Please check the GitHub Actions logs for details.",
                  "color": 15158332,
                  "fields": [
                    {
                      "name": "Branch",
                      "value": "${{ github.ref_name }}",
                      "inline": true
                    },
                    {
                      "name": "Commit",
                      "value": "[${{ github.sha }}](${{ github.event.compare }})",
                      "inline": true
                    },
                    {
                      "name": "Workflow Run",
                      "value": "[View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                      "inline": false
                    }
                  ],
                  "timestamp": "${{ github.event.head_commit.timestamp }}",
                  "footer": {
                    "text": "kawata.py CI/CD Pipeline"
                  }
                }
              ]
            }