name: Test WIP Workflows

on:
  push:
    branches: ["BE-Staging", "BE-Dev", "BE/Workflow-Testing"]
    paths-ignore: ["**.md", "ext/**"]
    tags:
      - 'v*'
  pull_request:
    branches: ["BE-Staging", "BE-Dev", "BE/Workflow-Testing"]
    paths-ignore: ["**.md", "ext/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Extract version from Poetry
        id: poetry_version
        run: |
          pip install poetry
          poetry lock
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          # Use OCI for multi-platform support
          outputs: type=oci,dest=/tmp/docker-oci
          tags: kawata.py:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker
          path: /tmp/docker-oci

  code-coverage:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/BE-Master' || github.ref == 'refs/heads/BE-Staging' || github.ref == 'refs/heads/BE-Dev' || github.ref == 'refs/heads/hina/updateV2' }}
    
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install poetry
          poetry lock
          poetry install

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=./ --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

