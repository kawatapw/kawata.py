name: Push to Docker Hub

on:
  push:
    branches:
      - BE-Master
      - BE-Staging
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  prepare:
    uses: ./.github/workflows/prep-build.yaml

  push:
    needs: prepare
    if: ${{ github.event_name != 'workflow_run' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/kawata.py:${{ needs.prepare.outputs.version }}
            ${{ github.ref == 'refs/heads/BE-Master' && format('{0}/kawata.py:prod', secrets.DOCKERHUB_USERNAME) || '' }}
            ${{ github.ref == 'refs/heads/BE-Staging' && format('{0}/kawata.py:staging', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max