services:
  ## shared services

  mysql-test:
    image: mysql:9.4.0
    # ports:
    #   - ${DB_PORT}:${DB_PORT}
    environment:
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_HOST: ${DB_HOST}
      MYSQL_TCP_PORT: ${DB_PORT}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - ./migrations/base.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - test-db-data:/var/lib/mysql
    networks:
      - test-network
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 2s
      timeout: 20s
      retries: 10

  redis-test:
    image: redis:8.2.2
    # ports:
    #   - ${REDIS_PORT}:${REDIS_PORT}
    user: root
    volumes:
      - test-redis-data:/data
    networks:
      - test-network
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASS}" ]; then
          redis-server --requirepass "$${REDIS_PASS}"
        else
          redis-server
        fi

  ## application services

  bancho-test:
    # Use environment variable for image tag, default to latest
    image: ${TEST_IMAGE:-kawatapw/kawata.py:latest}
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_started
    tty: true
    init: true
    volumes:
      - .:/srv/root
      - test-venv:/srv/root/.venv
      - test-data:/srv/root/.data
    networks:
      - test-network
    environment:
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}
      - APP_TZ=${APP_TZ}
      - TZ=${TZ}
      - SERVICE_NAME=${SERVICE_NAME}
      - CONTAINER_NAME=${CONTAINER_NAME}
      - CONTAINER_VERSION=${CONTAINER_VERSION}
      - CLIENT_VERSION=${CLIENT_VERSION}
      - CHEAT_SERVER=${CHEAT_SERVER}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASS=${REDIS_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - DATA_DIRECTORY=${DATA_DIRECTORY}
      - REQUEST_PENDING_ONLY=${REQUEST_PENDING_ONLY}
      - OSU_API_KEY=${OSU_API_KEY}
      - BOT_API_KEY=${BOT_API_KEY}
      - MIRROR_SEARCH_ENDPOINT=${MIRROR_SEARCH_ENDPOINT}
      - MIRROR_DOWNLOAD_ENDPOINT=${MIRROR_DOWNLOAD_ENDPOINT}
      - DOMAIN=${DOMAIN}
      - COMMAND_PREFIX=${COMMAND_PREFIX}
      - SEASONAL_BGS=${SEASONAL_BGS}
      - MENU_ICON_URL=${MENU_ICON_URL}
      - MENU_ONCLICK_URL=${MENU_ONCLICK_URL}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
      - DATADOG_APP_KEY=${DATADOG_APP_KEY}
      - DEBUG=${DEBUG}
      - REDIRECT_OSU_URLS=${REDIRECT_OSU_URLS}
      - PP_CACHED_ACCS=${PP_CACHED_ACCS}
      - DISALLOWED_NAMES=${DISALLOWED_NAMES}
      - DISALLOWED_PASSWORDS=${DISALLOWED_PASSWORDS}
      - DISALLOW_OLD_CLIENTS=${DISALLOW_OLD_CLIENTS}
      - DISALLOW_INGAME_REGISTRATION=${DISALLOW_INGAME_REGISTRATION}
      - DISCORD_AUDIT_LOG_WEBHOOK=${DISCORD_AUDIT_LOG_WEBHOOK}
      - DISCORD_INVITE=${DISCORD_INVITE}
      - DISCORD_LINK=${DISCORD_LINK}
      - AUTOMATICALLY_REPORT_PROBLEMS=${AUTOMATICALLY_REPORT_PROBLEMS}
      - LOG_WITH_COLORS=${LOG_WITH_COLORS}
      - SSL_CERT_PATH=${SSL_CERT_PATH}
      - SSL_KEY_PATH=${SSL_KEY_PATH}
      - DEVELOPER_MODE=${DEVELOPER_MODE}
      - DB_USE_SSL=${DB_USE_SSL}
      - DEBUG_LEVEL=${DEBUG_LEVEL}
      - DEBUG_FOCUS=${DEBUG_FOCUS}
      - USINGROOTDOMAIN=${USINGROOTDOMAIN}

volumes:
  test-venv:
  test-data:
  test-db-data:
  test-redis-data:

networks:
  test-network: