[project]
name = "kawata-py"
version = "5.3.2"
description = "A supercharged fork of an osu! server implementation optimized for maintainability in modern python"
authors = [
    {name = "Akatsuki Team", email = "team@akatsuki.pw"},
    {name = "Kawata Team", email = "team@kawata.pw"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "async-timeout==4.0.3",
    "bcrypt==4.1.2",
    "datadog==0.48.0",
    "fastapi==0.109.2",
    "orjson==3.11.6",
    "psutil==5.9.8",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.22",
    "requests==2.32.4",
    "timeago==1.0.16",
    "uvicorn==0.27.1",
    "uvloop==0.19.0; sys_platform != 'win32'",
    "winloop==0.1.1; sys_platform == 'win32'",
    "py3rijndael==0.3.3",
    "pytimeparse==1.1.8",
    "pydantic==2.6.1",
    "redis[hiredis]==5.0.1",
    "sqlalchemy>=1.4.42,<1.5",
    "akatsuki-pp-py==1.0.0",
    "cryptography==46.0.5",
    "tenacity==8.2.3",
    "httpx==0.26.0",
    "py-cpuinfo==9.0.0",
    "pytest==8.0.0",
    "pytest-asyncio==0.23.5",
    "asgi-lifespan==2.1.0",
    "respx==0.20.2",
    "tzdata==2024.1",
    "coverage==7.4.1",
    "databases[mysql]==0.8.0",
    "python-json-logger==2.0.7",
    "structlog==24.1.0",
    "python-logstash==0.4.8",
    "jsons==1.6.3",
    "python-rapidjson==1.17",
    "anyio==4.9.0",
    "PyYAML==6.0.1",
    "defusedxml>=0.7.1",
    "ci-tool @ {root:uri}/tools/ci"
]

[project.optional-dependencies]
dev = [
    "pre-commit==3.6.1",
    "types-psutil==5.9.5.20240205",
    "types-pymysql==1.1.0.1",
    "types-requests==2.31.0.20240125",
    "mypy==1.8.0",
    "types-pyyaml==6.0.12.12",
    "sqlalchemy2-stubs==0.0.2a38",
    "bandit==1.9.4",
    "ruff==0.15.5",
    "ty==0.0.29",
    "safety==3.7.0"
]

[dependency-groups]
ci = [
    "PyYAML==6.0.1",
    "jinja2>=3.0.0",
    "defusedxml>=0.7.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]  # Include all files in the root directory

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
no-build-package = ["akatsuki-pp-py"]

[tool.uv.workspace]
members = ["tools/ci"]

[tool.uv.sources]
ci-tool = { workspace = true }

[tool.ci]
storage_backend = "file"

[tool.ci.storage.file]
directory = ".ci-data"

[tool.ci.summary]
include_jobs = true
include_timing = true
include_artifacts = true
max_failures_shown = 50
max_code_snippet_lines = 12

[tool.ci.comment]
enabled = true
update_existing = true
include_job_table = true
include_failures = true
include_code_snippets = true

[tool.ci.jobs.ruff]
command = "uv run ruff check . --output-file reports/ruff.json --output-format json"
report = "reports/ruff.json"
parser = "ruff"

[tool.ci.jobs.ty]
command = "uv run ty check --output-format junit --no-progress . > reports/ty.xml"
report = "reports/ty.xml"
parser = "ty"

[tool.ci.jobs.bandit]
command = "uv run bandit -r app/ -f json -o reports/bandit.json 2>&1"
report = "reports/bandit.json"
parser = "bandit"

[tool.ci.jobs.mypy]
command = "uv run mypy . --pretty --show-error-end --show-error-context > reports/mypy.log"
report = "reports/mypy.log"
parser = "mypy"

[tool.ci.jobs.unit-tests]
command = "uv run pytest tests/unit/ --junit-xml=reports/junit-unit.xml -x -q 2>&1"
report = "reports/junit-unit.xml"
parser = "pytest"

# Build and integration tests are designed for local execution with ci run
# For GitHub Actions, these run as separate jobs with artifact passing
[tool.ci.jobs.build]
command = "docker build -t kawata-test:${GITHUB_SHA:-local} . && docker save kawata-test:${GITHUB_SHA:-local} -o reports/docker-image.tar"
report = "reports/docker-image.tar"
parser = ""

[tool.ci.jobs.integration-tests]
command = "docker load -i reports/docker-image.tar && docker compose -f docker-compose.test.yml up --detach --wait --wait-timeout 30 bancho-test mysql-test redis-test && docker compose -f docker-compose.test.yml exec -T bancho-test uv run pytest tests/integration/ --junit-xml=reports/junit-integration.xml -x -q 2>&1"
report = "reports/junit-integration.xml"
parser = "pytest"
depends_on = ["build"]

[tool.mypy]
strict = true
exclude = ["tests", "venv"]
disallow_untyped_calls = true
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
    "redundant-expr",
    "possibly-undefined"
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "aiomysql.*",
    "mitmproxy.*",
    "py3rijndael.*",
    "timeago.*",
    "pytimeparse.*",
    "cpuinfo.*",
    "defusedxml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tools.ci.*",
    "core.*",
    "modules.*",
    "storage.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
junit_suite_name = "kawata-py"
junit_log_passing_tests = true
junit_duration_report = "call"

[tool.ruff]
target-version = "py311"
# Allow ruff to fix what it can when --fix is passed
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    # --- Core ---
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    # --- Bugbear & Comprehensions ---
    "B",    # flake8-bugbear
    "B9",   # flake8-bugbear opinionated warnings
    "C4",   # flake8-comprehensions
    # --- Modernization ---
    "UP",   # pyupgrade
    # --- Simplification ---
    "SIM",  # flake8-simplify
    # --- Type checking ---
    "TCH",  # flake8-type-checking
    # --- Unused code ---
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate (commented-out code)
    # --- Naming ---
    "N",    # pep8-naming
    # --- Security ---
    "S",    # flake8-bandit
    # --- Builtins ---
    "A",    # flake8-builtins (shadowing)
    # --- Commas ---
    "COM",  # flake8-commas
    # --- String concat ---
    "ISC",  # flake8-implicit-str-concat
    # --- Misc lint ---
    "PIE",  # flake8-pie
    # --- Pytest ---
    "PT",   # flake8-pytest
    # --- Return statements ---
    "RET",  # flake8-return
    # --- Self access ---
    "SLF",  # flake8-self
    # --- Import tidiness ---
    "TID",  # flake8-tidy-imports
    # --- Pylint refactor (selective) ---
    "PLR",  # pylint refactor
    # --- Exception handling ---
    "TRY",  # tryceratops
    # --- Refurb ---
    "FURB", # refurb
    # --- Logging ---
    "LOG",  # flake8-logging
    # --- Ruff-specific ---
    "RUF",  # ruff rules
]
ignore = [
    "E501",    # line too long, handled by formatter
    "S105",    # possible hardcoded password (false positives in config)
    "S106",    # possible hardcoded password in function arg
    "S108",    # hardcoded temp file (false positives)
    "S603",    # subprocess call (false positives)
    "S607",    # partial executable path (false positives)
    "COM812",  # trailing comma on bare tuple (conflicts with ruff format)
    "COM819",  # prohibited trailing comma (conflicts with ruff format)
    "ISC001",  # single-line implicit string concatenation (conflicts with ruff format)
    "PLR2004", # magic value comparison (too noisy for this codebase)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "TRY003",  # long exception message (too noisy)
    "TRY300",  # consider else block (opinionated)
    "S311",    # pseudo-random generators (not security-sensitive here)
    "S324",    # hashlib insecure (used for checksums, not security)
    "S608",    # SQL injection (false positives with parameterized queries)
    "SIM108",  # ternary operator (opinionated)
    "SIM117",  # merge with statements (opinionated)
    "TID252",  # relative imports (used intentionally in this codebase)
    "RET504",  # unnecessary assignment before return (opinionated)
    "N818",    # exception naming (too noisy for this codebase)
    "FAST002", # fastapi dependency injection (too opinionated)
    "RUF012",  # mutable class default (too noisy for this codebase)
    "RUF001",  # ambiguous unicode character (false positives)
    "RUF002",  # ambiguous unicode in docstring (false positives)
    "RUF003",  # ambiguous unicode in comment (false positives)
    "RUF015",  # unnecessary iterable allocation (opinionated)
    "FURB129", # read-whole-file (false positives with context managers)
    "FURB148", # unnecessary enumerate (opinionated)
    "PT001",   # pytest fixture parenthesis (opinionated)
    "PT011",   # pytest raises too broad (too noisy)
    "PT015",   # pytest assertion always fails (type checker issue)
    "PT018",   # pytest composite assertion (opinionated)
    "B008",    # function call in default argument (FastAPI pattern)
    "B011",    # assert False (type checker issue)
    "B904",    # raise from in except (too noisy for this codebase)
    "SLF001",  # private member access (used intentionally in this codebase)
    "A001",    # variable shadows builtin (too noisy)
    "A002",    # argument shadows builtin (too noisy)
    "A003",    # class attribute shadows builtin (too noisy)
    "SIM102",  # collapsible if (opinionated)
    "SIM105",  # suppressible exception (opinionated)
    "SIM110",  # reimplemented built-in (opinionated)
    "ERA001",  # commented-out code (too noisy during development)
    "LOG002",  # logger name (opinionated)
    "LOG009",  # undocumented warn (opinionated)
    "LOG015",  # info in root logger (opinionated)
    "N801",    # class naming (too opinionated)
    "N802",    # function naming (too opinionated)
    "N803",    # argument naming (too opinionated)
    "N804",    # first argument naming (too opinionated)
    "N805",    # first argument naming (too opinionated)
    "N806",    # variable naming (too opinionated)
    "N815",    # variable naming in class scope (too opinionated)
    "N816",    # variable naming in global scope (too opinionated)
    "N999",    # module naming (too opinionated)
    "PIE790",  # unnecessary pass (opinionated)
    "PIE794",  # duplicate class field (false positives)
    "PIE808",  # unnecessary dict kwargs (opinionated)
    "PIE810",  # multiple starts with (opinionated)
    "TC001",  # type checking import (too noisy during development)
    "TC002",  # type checking import (too noisy during development)
    "TC003",  # type checking import (too noisy during development)
    "ARG001",  # unused function argument (too noisy during development)
    "ARG002",  # unused method argument (too noisy during development)
    "ARG003",  # unused class method argument (too noisy during development)
    "ARG004",  # unused static method argument (too noisy during development)
    "ARG005",  # unused lambda argument (too noisy during development)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert allowed in tests
    "S105",    # hardcoded password string in tests
    "S106",    # hardcoded password in function arg in tests
    "S311",    # pseudo-random in tests
    "PLR2004", # magic values in tests
    "SLF001",  # private member access in tests
    "N802",    # function naming in tests
    "B017",    # assert blind exception in tests
    "PT019",   # fixture without value (false positive)
    "F841",    # unused variable in tests
    "E712",    # comparison to True/False in tests
]
"tools/**/*.py" = [
    "S101",    # assert allowed in tools
    "PLR2004", # magic values in tools
    "SLF001",  # private member access in tools
    "ERA001",  # commented-out code in tools
]
"migrations/**/*.py" = [
    "ERA001",  # commented-out code in migrations
    "E501",    # long lines in migrations
]
"__init__.py" = [
    "F401",    # unused import in __init__.py (re-exports)
    "F403",    # star import in __init__.py
    "F405",    # undefined from star import
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Auto-add `from __future__ import annotations` to all files
required-imports = ["from __future__ import annotations"]
force-single-line = true
force-wrap-aliases = true
# Split imports into sections
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.bandit]
exclude_dirs = [
    ".denv",
    ".venv",
    "venv",
    "tests",
    "testing",
    "migrations",
    "tools",
    "__pycache__",
]
skips = [
    "B101",  # assert_used - acceptable in tests
    "B105",  # hardcoded_password_string - many false positives in our codebase
    "B324",  # hashlib - MD5/SHA1 used for non-security purposes (checksums, etc.)
    "B608",  # hardcoded_sql_expressions - false positives with parameterized queries
]
