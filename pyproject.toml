[project]
name = "kawata-py"
version = "5.3.2"
description = "A supercharged fork of an osu! server implementation optimized for maintainability in modern python"
authors = [
    {name = "Akatsuki Team", email = "team@akatsuki.pw"},
    {name = "Kawata Team", email = "team@kawata.pw"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "async-timeout==4.0.3",
    "bcrypt==4.1.2",
    "datadog==0.48.0",
    "fastapi==0.109.2",
    "orjson==3.11.6",
    "psutil==5.9.8",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.22",
    "requests==2.32.4",
    "timeago==1.0.16",
    "uvicorn==0.27.1",
    "uvloop==0.19.0; sys_platform != 'win32'",
    "winloop==0.1.1; sys_platform == 'win32'",
    "py3rijndael==0.3.3",
    "pytimeparse==1.1.8",
    "pydantic==2.6.1",
    "redis[hiredis]==5.0.1",
    "sqlalchemy>=1.4.42,<1.5",
    "akatsuki-pp-py==1.0.0",
    "cryptography==46.0.5",
    "tenacity==8.2.3",
    "httpx==0.26.0",
    "py-cpuinfo==9.0.0",
    "pytest==8.0.0",
    "pytest-asyncio==0.23.5",
    "asgi-lifespan==2.1.0",
    "respx==0.20.2",
    "tzdata==2024.1",
    "coverage==7.4.1",
    "databases[mysql]==0.8.0",
    "python-json-logger==2.0.7",
    "structlog==24.1.0",
    "python-logstash==0.4.8",
    "jsons==1.6.3",
    "python-rapidjson==1.17",
    "anyio==4.9.0",
    "PyYAML==6.0.1"
]

[project.optional-dependencies]
dev = [
    "pre-commit==3.6.1",
    "black==26.3.1",
    "isort==5.13.2",
    "autoflake==2.2.1",
    "types-psutil==5.9.5.20240205",
    "types-pymysql==1.1.0.1",
    "types-requests==2.31.0.20240125",
    "mypy==1.8.0",
    "types-pyyaml==6.0.12.12",
    "sqlalchemy2-stubs==0.0.2a38",
    "bandit==1.9.4",
    "ruff==0.15.5",
    "ty==0.0.29",
    "safety==3.7.0"
]

[dependency-groups]
ci = [
    "PyYAML==6.0.1",
    "jinja2>=3.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]  # Include all files in the root directory

[tool.uv]
no-build-package = ["akatsuki-pp-py"]

[tool.mypy]
strict = true
exclude = ["tests", "venv"]
disallow_untyped_calls = true
enable_error_code = [
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
    "redundant-expr",
    "possibly-undefined"
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "aiomysql.*",
    "mitmproxy.*",
    "py3rijndael.*",
    "timeago.*",
    "pytimeparse.*",
    "cpuinfo.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tools.ci.*",
    "core.*",
    "modules.*",
    "storage.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_requird_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
junit_suite_name = "kawata-py"
junit_log_passing_tests = true
junit_duration_report = "call"

[tool.isort]
add_imports = ["from __future__ import annotations"]
force_single_line = true
profile = "black"

[tool.ruff]
# Enable fixers
fix = true
unsafe-fixes = false
target-version = "py311"

[tool.ruff.lint]
# Enable common linting rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]
exclude_dirs = [
    ".denv",
    ".venv",
    "venv",
    "tests",
    "testing",
    "migrations",
    "tools",
    "__pycache__",
]
skips = [
    "B101",  # assert_used - acceptable in tests
    "B105",  # hardcoded_password_string - many false positives in our codebase
    "B324",  # hashlib - MD5/SHA1 used for non-security purposes (checksums, etc.)
    "B608",  # hardcoded_sql_expressions - false positives with parameterized queries
]
